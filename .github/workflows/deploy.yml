name: Deploy backend to Render

# The Render Blueprint sets autoDeployTrigger: 'off', so this workflow is the
# single deploy path for backend changes. Frontend changes deploy via Vercel.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render deploy hook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set (see docs/deployment.md)"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 --retry-connrefused -X POST "$DEPLOY_HOOK_URL"
          echo "Render deploy requested."
